<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Tile -->
  <rect width="160" height="160" rx="28" fill="#202024"/>

  <!-- Scope Ring -->
  <circle
    cx="80"
    cy="80"
    r="34"
    fill="none"
    stroke="#FF6B00"
    stroke-width="10"/>

  <!-- Crosshairs -->
  <line x1="80" y1="22" x2="80" y2="46"
        stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <line x1="80" y1="114" x2="80" y2="138"
        stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <line x1="22" y1="80" x2="46" y2="80"
        stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <line x1="114" y1="80" x2="138" y2="80"
        stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>

  <!-- Centre Dot -->
  <circle
    cx="80"
    cy="80"
    r="7"
    fill="#FF6B00"/>

  <!-- Detection Indicator -->
  <circle
    cx="118"
    cy="42"
    r="9"
    fill="#FFD166"/>
</svg>
